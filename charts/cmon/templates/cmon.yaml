#Service Account
kind: ServiceAccount
apiVersion: v1
metadata:
  name: cmon-service-account
  namespace: {{ .Release.Namespace }}
# CIS Kubernetes Benchmark 5.1.6 - Ensure that Service Account Tokens are not automatically mounted.
# Vulnerability: When true, every pod gets a token that can access the Kubernetes API.
# If the pod is compromised, an attacker can use that token to escalate privileges.
# Fix: Set to false and use a Secret-based token (cmon-sa-token) mounted explicitly as a volume,
# so only the required service account token is available with RBAC-scoped permissions.
automountServiceAccountToken: false
---
#Cmon Role
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cmon-role
rules:
- apiGroups:
    - apps
  resources:
    - deployments
    - replicasets
    - replicationcontrollers
    - daemonsets
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - metrics.k8s.io
  resources:
    - pods
    - nodes
  verbs:
    - get
    - list
    - watch
- apiGroups:
  - ""
  resources:
  - services
  - events
  - endpoints
  - pods
  - nodes
  - persistentvolumeclaims
  - replicationcontrollers
  - limitranges
  - nodes/proxy
  - nodes/metrics
  - nodes/spec
  - nodes/stats
  - componentstatuses
  - resourcequotas
  - count/persistentvolumeclaims
  - count/services
  - count/secrets
  - count/configmaps
  - count/replicationcontrollers
  - count/deployments.apps
  - count/replicasets.apps
  - count/statefulsets.apps
  - count/jobs.batch
  - count/cronjobs.batch
  - count/deployments.extensions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - "autoscaling"
  resources:
  - horizontalpodautoscalers
  verbs:
  - list
  - watch
- apiGroups:  # To create the leader election token
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - update
- nonResourceURLs:
  - "/version"
  - "/healthz"
  - "/metrics"
  verbs:
  - get
---
# Secret-based token for Kubernetes API access (used when automountServiceAccountToken is false)
apiVersion: v1
kind: Secret
metadata:
  name: cmon-sa-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: cmon-service-account
type: kubernetes.io/service-account-token
---
#ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmon-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cmon-role
subjects:
- kind: ServiceAccount
  name: cmon-service-account
  namespace: {{ .Release.Namespace }}
---
#DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cmon
  namespace: {{ .Release.Namespace }}
  labels:
    name: cmon
    app: cmon
spec:
  selector:
    matchLabels:
      name: cmon
  template:
    metadata:
      labels:
        name: cmon
        app: cmon
    spec:
      hostPID: true
      serviceAccountName: cmon-service-account
      # CIS Kubernetes Benchmark 5.1.6 - Disable automatic token mount at pod level.
      # Both ServiceAccount and pod spec must be set to false to fully comply.
      # The agent still gets Kubernetes API access via the Secret-based token (cmon-sa-token)
      # mounted as a volume at /var/run/secrets/kubernetes.io/serviceaccount.
      automountServiceAccountToken: false
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      containers:
        - name: cmon
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
               name: cmon-config
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Node name for Kubernetes node-level metrics
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
          - containerPort: {{ .Values.port }}
            hostPort: {{ .Values.port }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
          # Liveness probe to restart container if CavMonAgent process dies
          #livenessProbe:
            #exec:
              #command:
              #  - pgrep
              #  - -f
             #   - CavMonAgent
            #initialDelaySeconds: 30
            #periodSeconds: 10
            #failureThreshold: 3
          volumeMounts:
          - name: varlogs
            mountPath: /var/log
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true
          - name: hostsys
            mountPath: /host/sys
          - name: hostproc
            mountPath: /host/proc
          - name: varrun
            mountPath: /var/run
          - name: cmon-volume
            mountPath: /home/cavisson/monitors/sys/cmon.env
            subPath: cmon.env
          - name: nf-volume
            mountPath: /home/cavisson/monitors/sys/nf.env
            subPath: nf.env
          # Mount Secret-based service account token for Kubernetes API access
          - name: kube-api-access
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
          {{- if (index .Values "tls-enabled") }}
          - name: tls-volume
            mountPath: /home/cavisson/monitors/certs/
            readOnly: true
          {{- end }}
      volumes:
      # Secret-based service account token volume
      - name: kube-api-access
        secret:
          secretName: cmon-sa-token
      - name: varlogs
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: hostsys
        hostPath:
          path: /sys
      - name: hostproc
        hostPath:
          path: /proc
      - name: varrun
        hostPath:
          path: /var/run
      - name: cmon-volume
        configMap:
          name: cmon-config
          defaultMode: 440
      - name: nf-volume
        configMap:
          name: cmon-config
          defaultMode: 440
      {{- if (index .Values "tls-enabled") }}
      - name: tls-volume
        secret:
         secretName: {{ .Values.tlsSecretName }}
      {{- end }}
