enabled: true
tls-enabled: false

image:
  repository: cloud-build.cav-test.com/cmon_nf_agent
  tag: "4.16.0.63"
  imagePullPolicy: IfNotPresent

port: 7891

resources:
  limits:
    cpu: "500m"
    memory: "750Mi"
  requests:
    cpu: "250m"
    memory: "550Mi"

tlsSecretName: tls-secret

jvmOpts: "-Xms256m -Xmx512m"
monAgentOpts: "-W both"

nf:
  logStorageEnv: "MyAPP"
  outputHost: "azcusdautovm01-data.corp.ad.com"
  outputPort: "443"
  ymlConfigNfdb: "false"
  endpointPrefix: "/netforest"
  autoDiscovery: "false"
  sslVerification: "false"
