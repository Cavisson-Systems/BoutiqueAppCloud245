apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: cluster-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cluster-agent
  template:
    metadata:
      labels:
        app: cluster-agent
      {{- with .Values.podFinalizers }}
      finalizers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: cluster-agent-sa
      containers:
        - name: cluster-agent
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VPA_NAMESPACE
              value: {{ .Values.vpaNamespace | quote }}
            - name: ZAP_NAMESPACE
              value: {{ .Values.zapNamespace | quote }}
            - name: KUBEOPT_URL
              value: {{ .Values.kubeoptUrl | quote }}
            - name: DATASOURCE_NAME
              value: {{ .Values.datasourceName | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            # Agents install Flux only when FLUX_ENABLED="true"; always rendered explicitly so
            # older agent images (which defaulted to on) honour the value.
            - name: FLUX_ENABLED
              value: {{ .Values.flux.enabled | quote }}
            - name: FLUX_GIT_URL
              value: {{ .Values.flux.gitUrl | quote }}
            - name: FLUX_GIT_BRANCH
              value: {{ .Values.flux.gitBranch | quote }}
            - name: FLUX_GIT_PATH
              value: {{ .Values.flux.gitPath | quote }}
            - name: FLUX_VERSION
              value: {{ .Values.flux.version | quote }}
            - name: FLUX_REGISTRY
              value: {{ .Values.flux.registry | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
