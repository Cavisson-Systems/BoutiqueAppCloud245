enabled: true

image:
  repository: cavissonsystem/cavisson-cluster-agent
  tag: 4.16.0.B60
  pullPolicy: IfNotPresent

replicas: 1
terminationGracePeriodSeconds: 200

# Sized for clusters with up to 1,000 pods (see README "Cluster Agent: recommended CPU and memory")
resources:
  requests:
    cpu: "200m"
    memory: "384Mi"
  limits:
    cpu: "1"
    memory: "768Mi"

# KubeOpt backend (prefer https)
kubeoptUrl: "http://demoai.cav-test.com:8282"
datasourceName: "BoutiqueAzureCreds"
clusterName: "cavission-test"

# Namespaces of the components the agent manages
vpaNamespace: "cavisson-vpa"
zapNamespace: "security-system"

# Flux GitOps settings (rendered as FLUX_* env vars on the agent).
flux:
  enabled: true
  gitUrl: "https://github.com/Cavisson-Systems/Flux-CD.git"
  gitBranch: "main"
  gitPath: "./boutique-fluxcd"
  version: "v2.8.6"
  registry: "ghcr.io/fluxcd"

# Kyverno is disabled: installed only when KYVERNO_POLICY_ENABLED="true".

extraEnv: []
