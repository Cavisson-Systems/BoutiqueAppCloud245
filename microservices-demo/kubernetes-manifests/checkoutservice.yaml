apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: boutique
  name: checkoutservice
  labels:
    app: checkoutservice

spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkoutservice

  template:
    metadata:
      labels:
        app: checkoutservice

    spec:
      serviceAccountName: checkoutservice

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: server
          image: cavissonsystem/checkoutservice:javaV6

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          ports:
            - containerPort: 5050

          startupProbe:
            grpc:
              port: 5050
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            grpc:
              port: 5050
            initialDelaySeconds: 90
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            grpc:
              port: 5050
            initialDelaySeconds: 90
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: PORT
              value: "5050"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: PAYMENT_SERVICE_ADDR
              value: "paymentservice:50051"
            - name: EMAIL_SERVICE_ADDR
              value: "emailservice:5000"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 150m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  namespace: boutique
  name: checkoutservice
  labels:
    app: checkoutservice

spec:
  type: ClusterIP
  selector:
    app: checkoutservice

  ports:
    - name: grpc
      port: 5050
      targetPort: 5050

---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: boutique
  name: checkoutservice
